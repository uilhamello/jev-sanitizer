[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-sanitizer"
dynamic = ["version"]
description = "Unofficial Jev (TypeSafe) client — CLI, MCP server and library — that sanitizes PII and secrets before every request."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Pinned to tags. Archive URL instead of git+: installs without git.
# The core loads the regions; "br" is the default region (config: sanitizers).
dependencies = [
    "text-sanitizer-core @ https://github.com/uilhamello/text-sanitizer-core/archive/refs/tags/v0.1.0.zip",
    "text-sanitizer-br @ https://github.com/uilhamello/text-sanitizer-br/archive/refs/tags/v0.2.0.zip",
]
keywords = ["jev", "typesafe", "mcp", "pii", "sanitizer", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
ner = [
    "text-sanitizer-br[ner] @ https://github.com/uilhamello/text-sanitizer-br/archive/refs/tags/v0.2.0.zip",
]

[project.scripts]
jev-sanitizer = "jev_sanitizer.cli:main"
jev-sanitizer-mcp = "jev_sanitizer.mcp_server:main"

[tool.setuptools.dynamic]
version = { attr = "jev_sanitizer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
